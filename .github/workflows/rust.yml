name: Build Rust
on: workflow_dispatch # 支持手动点 Run workflow 触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - name: Build Release
        run: cargo build --release
      - name: Upload 打包产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/release/*.exe
